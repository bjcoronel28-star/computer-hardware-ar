
<!DOCTYPE html>
<html>
<head>
  <title>My First Computer Hardware AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./asset/targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="hardware"
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf">
    </a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      src="#hardware"
      position="0 0 0.1"
      rotation="0 0 0"
      scale="0.005 0.005 0.005"
      animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear">
    </a-gltf-model>

  </a-entity>

</a-scene>

</body>
</html>
